<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรับรายได้ (Income Tracker)</title>
    
    <!-- โหลดฟอนต์ Prompt จาก Google Fonts (แบบปกติ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- โหลด Tailwind CSS เพื่อความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ตั้งค่า Tailwind ให้ใช้ฟอนต์ Prompt เป็นหลัก -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- โหลด React และ ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- โหลด Babel เพื่อแปลภาษา React ให้เบราว์เซอร์เข้าใจ -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F9FAFB]">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const { useState, useEffect, useMemo } = React;

        // --- ตั้งค่าระบบหลังบ้าน (Firebase) ---
        const getFirebaseConfig = () => {
            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    return JSON.parse(__firebase_config);
                }
            } catch(e){}
            return { apiKey: "local_test" }; // ใช้โหมดทดสอบถ้าเปิดในคอมธรรมดา
        };
        
        const firebaseConfig = getFirebaseConfig();
        let app, auth, db;
        
        // ถ้าเปิดบน Server จะเชื่อมระบบหลังบ้าน
        if (firebaseConfig.apiKey !== "local_test") {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        function App() {
            const [user, setUser] = useState(null);
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(true);
            
            // Navigation & Modal State
            const [currentView, setCurrentView] = useState('dashboard');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);

            // Form State
            const [amount, setAmount] = useState('');
            const [note, setNote] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            // Slip Upload State
            const [slipFile, setSlipFile] = useState(null);
            const [slipPreview, setSlipPreview] = useState(null);
            const [viewingSlipImage, setViewingSlipImage] = useState(null);

            // Dashboard Filter State
            const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [isFilterOpen, setIsFilterOpen] = useState(false);

            // Check Slip Filter State
            const [checkSlipMonth, setCheckSlipMonth] = useState(new Date().getMonth());
            const [checkSlipYear, setCheckSlipYear] = useState(new Date().getFullYear());
            const [hasSearchedSlip, setHasSearchedSlip] = useState(false);

            // ตัวแปรค่าเดือนและปี
            const thaiMonths = [
                "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
            ];
            const years = Array.from(new Array(5), (val, index) => new Date().getFullYear() - index);

            // Real-time Clock State
            const [currentTime, setCurrentTime] = useState(new Date());

            // 1. Auth Effect (ตรวจสอบการเข้าสู่ระบบ)
            useEffect(() => {
                if (!auth) {
                    // โหมดเปิดเล่นในคอมจำลองผู้ใช้ขึ้นมา
                    setUser({ uid: 'local-test-user' });
                    setLoading(false);
                    return;
                }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth Error:", error);
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                });
                return () => unsubscribe();
            }, []);

            // 2. Fetch Data Effect (ดึงข้อมูล)
            useEffect(() => {
                if (!user) return;
                
                if (!db) {
                    // โหมดเปิดในคอม ไม่ต้องดึงข้อมูลจริงจากเน็ต
                    setLoading(false);
                    return;
                }

                setLoading(true);
                const collectionRef = collection(db, 'artifacts', appId, 'users', user.uid, 'transactions');
                
                const unsubscribe = onSnapshot(collectionRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setTransactions(data);
                    setLoading(false);
                }, (error) => {
                    console.error("Firestore Error:", error);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [user]);

            // 3. Clock Effect (นาฬิกาเดินแบบเรียลไทม์)
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // 4. คำนวณยอดรวมรายเดือนและรายปี (สำหรับ Dashboard)
            const { currentMonthTransactions, currentMonthTotal, currentYearTotal } = useMemo(() => {
                let monthTotal = 0;
                let yearTotal = 0;
                const monthTx = [];

                transactions.forEach(t => {
                    const d = new Date(t.date);
                    // คำนวณเฉพาะปีที่เลือก
                    if (d.getFullYear() === selectedYear) {
                        yearTotal += Number(t.amount);
                        // กรองเฉพาะเดือนที่เลือก
                        if (d.getMonth() === selectedMonth) {
                            monthTotal += Number(t.amount);
                            monthTx.push(t);
                        }
                    }
                });

                // เรียงรายการล่าสุดขึ้นก่อน
                monthTx.sort((a, b) => new Date(b.date) - new Date(a.date));

                return { 
                    currentMonthTransactions: monthTx, 
                    currentMonthTotal: monthTotal, 
                    currentYearTotal: yearTotal 
                };
            }, [transactions, selectedMonth, selectedYear]);

            // 5. คำนวณข้อมูลสำหรับหน้า Check Slip
            const filteredCheckSlips = useMemo(() => {
                if (!hasSearchedSlip) return [];
                return transactions.filter(t => {
                    const d = new Date(t.date);
                    return d.getMonth() === checkSlipMonth && d.getFullYear() === checkSlipYear;
                }).sort((a, b) => new Date(b.date) - new Date(a.date)); // เรียงรายการล่าสุดขึ้นก่อน
            }, [transactions, checkSlipMonth, checkSlipYear, hasSearchedSlip]);

            // 6. คำนวณข้อมูลสำหรับหน้า Customer (สรุปยอดตามลูกค้า)
            const customerSummary = useMemo(() => {
                const summary = {};
                transactions.forEach(t => {
                    // ใช้ note เป็นชื่อลูกค้า ถ้าระบุเหมือนกันจะเอามารวมกัน
                    const customerName = (t.note || 'ลูกค้าทั่วไป').trim();
                    if (!summary[customerName]) {
                        summary[customerName] = {
                            name: customerName,
                            totalAmount: 0,
                            transactionCount: 0,
                            lastDate: t.date
                        };
                    }
                    summary[customerName].totalAmount += Number(t.amount);
                    summary[customerName].transactionCount += 1;
                    // อัปเดตวันที่ล่าสุด
                    if (new Date(t.date) > new Date(summary[customerName].lastDate)) {
                        summary[customerName].lastDate = t.date;
                    }
                });
                // แปลงเป็น Array และเรียงจากยอดเงินรวมมากสุดไปน้อยสุด
                return Object.values(summary).sort((a, b) => b.totalAmount - a.totalAmount); 
            }, [transactions]);

            // ฟังก์ชันเลือกรูปสลิป
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setSlipFile(file);
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setSlipPreview(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            // ฟังก์ชันบันทึกข้อมูล
            const handleAddTransaction = async (e) => {
                e.preventDefault();
                if (!user || !amount || isNaN(amount) || amount <= 0) return;

                setIsSubmitting(true);
                
                const newTransaction = {
                    amount: Number(amount),
                    note: note || 'รับเงินโอน',
                    slipImage: slipPreview,
                    hasSlip: !!slipPreview,
                    date: new Date().toISOString(),
                    createdAt: new Date().toISOString()
                };

                try {
                    if (db) {
                        // บันทึกลง Server ของจริง
                        const collectionRef = collection(db, 'artifacts', appId, 'users', user.uid, 'transactions');
                        await addDoc(collectionRef, newTransaction);
                    } else {
                        // โหมดเปิดในคอม (บันทึกจำลอง)
                        setTransactions(prev => [{ id: Date.now().toString(), ...newTransaction }, ...prev]);
                    }
                    
                    // ล้างฟอร์ม
                    setAmount('');
                    setNote('');
                    setSlipFile(null);
                    setSlipPreview(null);
                    setIsAddModalOpen(false);
                } catch (error) {
                    console.error("Error adding transaction:", error);
                } finally {
                    setIsSubmitting(false);
                }
            };

            // ฟังก์ชันลบข้อมูล
            const handleDelete = async (id) => {
                if (!user) return;
                try {
                    if (db) {
                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'transactions', id);
                        await deleteDoc(docRef);
                    } else {
                        // โหมดเปิดในคอม
                        setTransactions(prev => prev.filter(t => t.id !== id));
                    }
                } catch (error) {
                    console.error("Error deleting:", error);
                }
            };

            // การเปลี่ยนหน้า
            const handleNavigate = (view) => {
                setCurrentView(view);
                setIsMobileMenuOpen(false);
                if (view === 'check-slip') {
                    setHasSearchedSlip(false); // รีเซ็ตสถานะการค้นหาเมื่อเข้ามาหน้า Check Slip ใหม่
                }
            };

            if (!user || loading) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-[#F9FAFB]">
                        <div className="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-orange-500"></div>
                    </div>
                );
            }

            // --- ส่วนแสดงผลหน้าตา Dashboard ---
            const renderDashboard = () => (
                <div className="space-y-6">
                    
                    {/* วันที่และนาฬิกา Real-time */}
                    <div className="flex items-center gap-2 text-sm font-medium text-gray-500 bg-white w-fit px-4 py-2.5 rounded-xl border border-gray-200 shadow-sm">
                        <svg className="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span>{currentTime.toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                        <span className="mx-1 text-gray-300">|</span>
                        <span className="text-gray-700 font-bold">{currentTime.toLocaleTimeString('th-TH')} น.</span>
                    </div>

                    {/* ชื่อหน้า Dashboard (ย้ายลงมาตรงนี้) */}
                    <h2 className="text-2xl font-bold text-orange-500 uppercase tracking-wide">DASHBOARD</h2>

                    {/* กล่องสรุปยอด (สีพาสเทล) */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-orange-50/80 p-5 rounded-xl border border-orange-100 shadow-sm transition-all hover:shadow-md">
                            <div className="flex items-center gap-2 mb-2">
                                <h3 className="text-sm font-medium text-orange-800">ยอดเงินเดือน {thaiMonths[selectedMonth]}</h3>
                                <svg className="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            </div>
                            <div className="flex items-baseline gap-2">
                                <span className="text-3xl font-bold text-orange-900">
                                    ฿{currentMonthTotal.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}
                                </span>
                            </div>
                        </div>

                        <div className="bg-blue-50/80 p-5 rounded-xl border border-blue-100 shadow-sm transition-all hover:shadow-md">
                            <div className="flex items-center gap-2 mb-2">
                                <h3 className="text-sm font-medium text-blue-800">ยอดเงินรวมปี {selectedYear + 543}</h3>
                                <svg className="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            </div>
                            <div className="flex items-baseline gap-2">
                                <span className="text-3xl font-bold text-blue-900">
                                    ฿{currentYearTotal.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}
                                </span>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm transition-all hover:shadow-md">
                            <div className="flex items-center gap-2 mb-2">
                                <h3 className="text-sm font-medium text-gray-500">จำนวนรายการเดือน {thaiMonths[selectedMonth]}</h3>
                            </div>
                            <div className="flex items-baseline gap-2">
                                <span className="text-3xl font-bold text-gray-900">
                                    {currentMonthTransactions.length}
                                </span>
                                <span className="text-sm font-medium text-green-500 bg-green-50 px-2 py-0.5 rounded-full">รายการ</span>
                            </div>
                        </div>
                    </div>

                    {/* ตารางรายการโอน */}
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col">
                        <div className="p-4 border-b border-gray-200 flex flex-wrap gap-3 items-center justify-between bg-white">
                            <div className="flex items-center gap-3 relative">
                                <button 
                                    onClick={() => setIsFilterOpen(!isFilterOpen)}
                                    className={`flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-lg transition-colors border ${isFilterOpen ? 'bg-orange-50 text-orange-600 border-orange-200' : 'text-gray-700 bg-white border-gray-200 hover:bg-gray-50'}`}
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>
                                    ตัวกรอง
                                </button>

                                {/* Dropdown ตัวกรอง */}
                                {isFilterOpen && (
                                    <>
                                        {/* พื้นหลังคลิกเพื่อปิด Dropdown */}
                                        <div className="fixed inset-0 z-10" onClick={() => setIsFilterOpen(false)}></div>
                                        
                                        <div className="absolute top-full mt-2 left-0 w-64 bg-white border border-gray-100 rounded-xl shadow-xl z-20 p-4 animate-fade-in-up">
                                            <div className="mb-4">
                                                <label className="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wider">เลือกเดือน</label>
                                                <select 
                                                    value={selectedMonth} 
                                                    onChange={e => setSelectedMonth(Number(e.target.value))} 
                                                    className="w-full text-sm border border-gray-200 rounded-lg p-2.5 focus:ring-1 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all cursor-pointer bg-gray-50 hover:bg-white"
                                                >
                                                    {thaiMonths.map((m, i) => <option key={i} value={i}>{m}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wider">เลือกปี</label>
                                                <select 
                                                    value={selectedYear} 
                                                    onChange={e => setSelectedYear(Number(e.target.value))} 
                                                    className="w-full text-sm border border-gray-200 rounded-lg p-2.5 focus:ring-1 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all cursor-pointer bg-gray-50 hover:bg-white"
                                                >
                                                    {years.map(y => <option key={y} value={y}>{y + 543}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    </>
                                )}

                                <div className="h-4 w-px bg-gray-300 ml-2"></div>
                                <span className="text-sm text-gray-500 font-medium ml-2">รายการโอนเงินล่าสุด</span>
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[800px]">
                                <thead>
                                    <tr className="bg-gray-50/50">
                                        <th className="py-3 px-4 w-12 text-center border-b border-gray-200">
                                            <input type="checkbox" className="rounded text-orange-500 focus:ring-orange-500 border-gray-300" disabled />
                                        </th>
                                        <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200">รายละเอียดลูกค้า</th>
                                        <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200">วันที่และเวลา</th>
                                        <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200">จำนวนเงิน</th>
                                        <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200">สถานะ</th>
                                        <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200 text-right">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {currentMonthTransactions.length === 0 ? (
                                        <tr>
                                            <td colSpan="6" className="py-12 text-center text-gray-400">
                                                <svg className="w-8 h-8 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                                ยังไม่มีรายการในเดือนนี้
                                            </td>
                                        </tr>
                                    ) : (
                                        currentMonthTransactions.map((t) => {
                                            const dateObj = new Date(t.date);
                                            return (
                                                <tr key={t.id} className="hover:bg-gray-50/80 transition-colors group">
                                                    <td className="py-3 px-4 text-center">
                                                        <input type="checkbox" className="rounded text-orange-500 focus:ring-orange-500 border-gray-300" />
                                                    </td>
                                                    <td className="py-3 px-4">
                                                        <div className="font-medium text-gray-900 flex items-center gap-2">
                                                            {t.note}
                                                            {t.hasSlip && t.slipImage && (
                                                                <button 
                                                                    onClick={() => setViewingSlipImage(t.slipImage)}
                                                                    className="text-orange-500 hover:text-orange-600 focus:outline-none transition-transform hover:scale-110 flex items-center justify-center p-1 rounded-full hover:bg-orange-50"
                                                                    title="คลิกเพื่อดูสลิป"
                                                                >
                                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                                                </button>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="py-3 px-4 text-sm">
                                                        <span className="text-orange-500 font-medium">{dateObj.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric' })}</span> <br/>
                                                        <span className="text-xs text-blue-500 font-medium">{dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.</span>
                                                    </td>
                                                    <td className="py-3 px-4 font-semibold text-gray-900">
                                                        ฿{t.amount.toLocaleString('th-TH', { minimumFractionDigits: 2 })}
                                                    </td>
                                                    <td className="py-3 px-4">
                                                        <span className="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-indigo-50 text-indigo-700">
                                                            รับยอดแล้ว
                                                        </span>
                                                    </td>
                                                    <td className="py-3 px-4 text-right">
                                                        <button 
                                                            onClick={() => handleDelete(t.id)}
                                                            className="text-gray-400 hover:text-red-500 p-1 opacity-0 group-hover:opacity-100 transition-opacity"
                                                            title="ลบรายการ"
                                                        >
                                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                        </button>
                                                    </td>
                                                </tr>
                                            )
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            // --- ส่วนแสดงผลหน้าตา Check Slip ---
            const renderCheckSlip = () => (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-orange-500 tracking-wide">Check Slip</h2>
                    
                    {/* กล่องตัวกรอง (เลือกเดือน/ปี) */}
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                        <h3 className="text-sm font-bold text-gray-700 mb-4 flex items-center gap-2">
                            <svg className="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>
                            ระบุเดือนและปีที่ต้องการตรวจสอบสลิป
                        </h3>
                        
                        <div className="flex flex-wrap items-end gap-4">
                            <div className="w-full sm:w-auto flex-1 min-w-[150px]">
                                <label className="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wider">เลือกเดือน</label>
                                <select 
                                    value={checkSlipMonth} 
                                    onChange={e => { setCheckSlipMonth(Number(e.target.value)); setHasSearchedSlip(false); }} 
                                    className="w-full text-sm border border-gray-200 rounded-lg p-2.5 focus:ring-1 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all cursor-pointer bg-gray-50 hover:bg-white"
                                >
                                    {thaiMonths.map((m, i) => <option key={i} value={i}>{m}</option>)}
                                </select>
                            </div>
                            <div className="w-full sm:w-auto flex-1 min-w-[150px]">
                                <label className="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wider">เลือกปี</label>
                                <select 
                                    value={checkSlipYear} 
                                    onChange={e => { setCheckSlipYear(Number(e.target.value)); setHasSearchedSlip(false); }} 
                                    className="w-full text-sm border border-gray-200 rounded-lg p-2.5 focus:ring-1 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all cursor-pointer bg-gray-50 hover:bg-white"
                                >
                                    {years.map(y => <option key={y} value={y}>{y + 543}</option>)}
                                </select>
                            </div>
                            <button
                                onClick={() => setHasSearchedSlip(true)}
                                className="w-full sm:w-auto bg-orange-500 hover:bg-orange-600 text-white font-medium py-2.5 px-8 rounded-lg transition-colors shadow-sm"
                            >
                                ตกลง (OK)
                            </button>
                        </div>
                    </div>

                    {/* ตารางรายการ (จะแสดงก็ต่อเมื่อกดปุ่ม "ตกลง" แล้ว) */}
                    {hasSearchedSlip && (
                        <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col animate-fade-in-up">
                            <div className="p-4 border-b border-gray-200 bg-white">
                                <span className="text-sm text-gray-700 font-bold">
                                    รายการโอนเงินลูกค้า ประจำเดือน{thaiMonths[checkSlipMonth]} {checkSlipYear + 543}
                                </span>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[800px]">
                                    <thead>
                                        <tr className="bg-gray-50/50">
                                            <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200">รายละเอียดลูกค้า</th>
                                            <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200">วันที่และเวลา</th>
                                            <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200">จำนวนเงิน</th>
                                            <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200 text-center">สลิปแนบ</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {filteredCheckSlips.length === 0 ? (
                                            <tr>
                                                <td colSpan="4" className="py-12 text-center text-gray-400">
                                                    <svg className="w-8 h-8 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                                    ไม่พบรายการโอนเงินในเดือนนี้
                                                </td>
                                            </tr>
                                        ) : (
                                            filteredCheckSlips.map((t) => {
                                                const dateObj = new Date(t.date);
                                                return (
                                                    <tr key={t.id} className="hover:bg-gray-50/80 transition-colors">
                                                        <td className="py-3 px-4 font-medium text-gray-900">{t.note}</td>
                                                        <td className="py-3 px-4 text-sm">
                                                            <span className="text-orange-500 font-medium">{dateObj.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric' })}</span> <br/>
                                                            <span className="text-xs text-blue-500 font-medium">{dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.</span>
                                                        </td>
                                                        <td className="py-3 px-4 font-semibold text-gray-900">
                                                            ฿{t.amount.toLocaleString('th-TH', { minimumFractionDigits: 2 })}
                                                        </td>
                                                        <td className="py-3 px-4 text-center">
                                                            {t.hasSlip && t.slipImage ? (
                                                                <button 
                                                                    onClick={() => setViewingSlipImage(t.slipImage)}
                                                                    className="inline-flex items-center gap-1.5 bg-orange-50 text-orange-600 hover:bg-orange-100 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors mx-auto"
                                                                >
                                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                                                    ดูสลิป
                                                                </button>
                                                            ) : (
                                                                <span className="text-xs text-gray-400">- ไม่มีสลิป -</span>
                                                            )}
                                                        </td>
                                                    </tr>
                                                )
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );

            const renderReports = () => (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800 uppercase tracking-wide">Reports</h2>
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                        <h2 className="text-lg font-bold text-gray-900 mb-4">ประวัติรายการทั้งหมด</h2>
                        <div className="space-y-4">
                            <p className="text-sm text-gray-500">มีข้อมูลทั้งหมด {transactions.length} รายการในระบบ</p>
                        </div>
                    </div>
                </div>
            );

            // --- ส่วนแสดงผลหน้าตา Customer (ลูกค้า) ---
            const renderCustomer = () => (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-orange-500 tracking-wide">Customer</h2>
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col animate-fade-in-up">
                        <div className="p-4 border-b border-gray-200 bg-white">
                            <span className="text-sm text-gray-700 font-bold">
                                สรุปยอดเงินรวมแยกลูกค้ารายบุคคล (ทั้งหมด {customerSummary.length} รายการ)
                            </span>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[800px]">
                                <thead>
                                    <tr className="bg-gray-50/50">
                                        <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200">ชื่อลูกค้า / รายละเอียด</th>
                                        <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200 text-center">จำนวนรายการโอน</th>
                                        <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200 text-right">ยอดเงินรวมทั้งหมด</th>
                                        <th className="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider border-b border-gray-200 text-center">ทำรายการล่าสุด</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {customerSummary.length === 0 ? (
                                        <tr>
                                            <td colSpan="4" className="py-12 text-center text-gray-400">
                                                <svg className="w-8 h-8 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                                ยังไม่มีข้อมูลลูกค้า
                                            </td>
                                        </tr>
                                    ) : (
                                        customerSummary.map((c, idx) => {
                                            const lastDateObj = new Date(c.lastDate);
                                            return (
                                                <tr key={idx} className="hover:bg-gray-50/80 transition-colors">
                                                    <td className="py-3 px-4">
                                                        <div className="font-medium text-gray-900 flex items-center gap-3">
                                                            <div className="w-8 h-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center shrink-0">
                                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                                            </div>
                                                            {c.name}
                                                        </div>
                                                    </td>
                                                    <td className="py-3 px-4 text-center text-sm font-medium text-gray-600">
                                                        {c.transactionCount} ครั้ง
                                                    </td>
                                                    <td className="py-3 px-4 font-bold text-orange-600 text-right">
                                                        ฿{c.totalAmount.toLocaleString('th-TH', { minimumFractionDigits: 2 })}
                                                    </td>
                                                    <td className="py-3 px-4 text-sm text-gray-500 text-center">
                                                        {lastDateObj.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric' })}
                                                    </td>
                                                </tr>
                                            )
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex h-screen bg-[#F9FAFB] text-gray-800 font-sans overflow-hidden">
                    
                    {/* เมนูด้านข้าง (Sidebar) */}
                    {isMobileMenuOpen && (
                        <div 
                            className="fixed inset-0 bg-gray-900/20 z-20 md:hidden backdrop-blur-sm transition-opacity"
                            onClick={() => setIsMobileMenuOpen(false)}
                        />
                    )}

                    <aside className={`fixed md:static inset-y-0 left-0 w-64 bg-white border-r border-gray-200 z-30 transform transition-transform duration-300 ease-in-out ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'} flex flex-col`}>
                        <div className="h-24 flex items-center px-6 border-b border-gray-200">
                            <img src="logo small.png" alt="GIC Logo" className="h-[72px] w-auto object-contain" />
                        </div>

                        <nav className="flex-1 px-3 py-6 space-y-1 overflow-y-auto">
                            <div className="px-3 mb-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider">Main Menu</div>
                            <button 
                                onClick={() => handleNavigate('dashboard')}
                                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all relative ${currentView === 'dashboard' ? 'text-orange-500 font-bold bg-orange-50/50' : 'text-orange-400 hover:bg-orange-50 hover:text-orange-500 font-medium'}`}
                            >
                                {currentView === 'dashboard' && <div className="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-5 bg-orange-500 rounded-r-full"></div>}
                                <svg className={`w-5 h-5 ${currentView === 'dashboard' ? 'text-orange-500' : 'text-orange-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                                <span className="uppercase">DASHBOARD</span>
                            </button>
                            <button 
                                onClick={() => handleNavigate('check-slip')}
                                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all relative ${currentView === 'check-slip' ? 'text-gray-900 font-semibold bg-orange-50/50' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium'}`}
                            >
                                {currentView === 'check-slip' && <div className="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-5 bg-orange-500 rounded-r-full"></div>}
                                <svg className={`w-5 h-5 ${currentView === 'check-slip' ? 'text-orange-500' : 'text-gray-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                Check Slip
                            </button>
                            <button 
                                onClick={() => handleNavigate('customer')}
                                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all relative ${currentView === 'customer' ? 'text-orange-500 font-bold bg-orange-50/50' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-900 font-medium'}`}
                            >
                                {currentView === 'customer' && <div className="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-5 bg-orange-500 rounded-r-full"></div>}
                                <svg className={`w-5 h-5 ${currentView === 'customer' ? 'text-orange-500' : 'text-gray-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                <span>Customer</span>
                            </button>
                        </nav>
                    </aside>

                    {/* พื้นที่หลัก */}
                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
                        <header className="bg-white border-b border-gray-200 h-24 px-4 md:px-8 flex items-center justify-between shrink-0">
                            <div className="flex items-center gap-4 flex-1">
                                <button 
                                    onClick={() => setIsMobileMenuOpen(true)} 
                                    className="md:hidden p-2 -ml-2 text-gray-600 hover:bg-gray-100 rounded-lg focus:outline-none"
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>
                                </button>
                                <h1 className="text-xl font-bold text-gray-900 hidden md:block">
                                    {currentView === 'dashboard' && <span className="text-orange-500 uppercase">DASHBOARD</span>}
                                    {currentView === 'check-slip' && 'Check Slip'}
                                    {currentView === 'customer' && <span className="text-orange-500 font-bold">Customer</span>}
                                    {currentView === 'reports' && 'Reports'}
                                </h1>
                            </div>
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => setIsAddModalOpen(true)}
                                    className="bg-orange-500 hover:bg-orange-600 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors flex items-center gap-2 shadow-sm"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                                    บันทึกรายการใหม่
                                </button>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            {currentView === 'dashboard' && renderDashboard()}
                            {currentView === 'check-slip' && renderCheckSlip()}
                            {currentView === 'customer' && renderCustomer()}
                            {currentView === 'reports' && renderReports()}
                        </main>
                    </div>

                    {/* หน้าต่าง (Modal) เพิ่มรายการ */}
                    {isAddModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-fade-in-up">
                                <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                                    <h3 className="text-lg font-bold text-gray-900">เพิ่มรายการรับเงิน</h3>
                                    <button 
                                        onClick={() => setIsAddModalOpen(false)}
                                        className="text-gray-400 hover:text-gray-600 p-1"
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                    </button>
                                </div>
                                <form onSubmit={handleAddTransaction} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">จำนวนเงิน (บาท) *</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            required
                                            className="w-full text-lg p-2.5 border border-gray-300 rounded-lg focus:ring-1 focus:ring-orange-500 focus:border-orange-500 transition-all outline-none"
                                            placeholder="0.00"
                                            value={amount}
                                            onChange={(e) => setAmount(e.target.value)}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">รายละเอียด / ชื่อลูกค้า</label>
                                        <input
                                            type="text"
                                            className="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-1 focus:ring-orange-500 focus:border-orange-500 transition-all outline-none"
                                            placeholder="เช่น ค่าสินค้า ก."
                                            value={note}
                                            onChange={(e) => setNote(e.target.value)}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">สลิปโอนเงิน (ไม่บังคับ)</label>
                                        {slipPreview ? (
                                            <div className="relative w-full h-32 bg-gray-50 rounded-lg border border-gray-200 overflow-hidden flex items-center justify-center group">
                                                <img src={slipPreview} alt="Slip preview" className="max-h-full max-w-full object-contain" />
                                                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                    <button
                                                        type="button"
                                                        onClick={() => { setSlipFile(null); setSlipPreview(null); }}
                                                        className="bg-white text-red-500 p-2 rounded-full hover:bg-red-50 shadow-sm transition-transform transform hover:scale-110"
                                                    >
                                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                    </button>
                                                </div>
                                            </div>
                                        ) : (
                                            <label className="w-full flex flex-col items-center justify-center p-4 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:bg-orange-50 hover:border-orange-300 transition-colors">
                                                <svg className="w-6 h-6 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                                <span className="text-sm text-gray-500 font-medium">คลิกเพื่อแนบรูปสลิป</span>
                                                <input type="file" accept="image/*" className="hidden" onChange={handleFileChange} />
                                            </label>
                                        )}
                                    </div>

                                    <div className="pt-2 flex gap-3">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setIsAddModalOpen(false);
                                                setSlipFile(null);
                                                setSlipPreview(null);
                                            }}
                                            className="flex-1 bg-white border border-gray-300 text-gray-700 font-medium py-2.5 px-4 rounded-lg hover:bg-gray-50 transition-colors"
                                        >
                                            ยกเลิก
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={isSubmitting || !amount}
                                            className="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-medium py-2.5 px-4 rounded-lg transition-colors disabled:bg-orange-300 disabled:cursor-not-allowed"
                                        >
                                            {isSubmitting ? 'กำลังบันทึก...' : 'บันทึก'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Pop-up ดูรูปสลิป */}
                    {viewingSlipImage && (
                        <div 
                            className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-gray-900/80 backdrop-blur-sm animate-fade-in-up"
                            onClick={() => setViewingSlipImage(null)}
                        >
                            <div 
                                className="relative max-w-2xl max-h-[90vh] w-full flex flex-col items-center justify-center" 
                                onClick={e => e.stopPropagation()}
                            >
                                <button
                                    onClick={() => setViewingSlipImage(null)}
                                    className="absolute -top-12 right-0 md:-right-10 text-white hover:text-gray-300 p-2 focus:outline-none transition-transform hover:scale-110"
                                    title="ปิดรูปภาพ"
                                >
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                </button>
                                <img 
                                    src={viewingSlipImage} 
                                    alt="สลิปโอนเงิน" 
                                    className="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl border-4 border-white/10" 
                                />
                            </div>
                        </div>
                    )}
                    
                    <style dangerouslySetInnerHTML={{__html: `
                        @keyframes fadeInUp {
                            from { opacity: 0; transform: translateY(10px); }
                            to { opacity: 1; transform: translateY(0); }
                        }
                        .animate-fade-in-up {
                            animation: fadeInUp 0.2s ease-out forwards;
                        }
                    `}} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
